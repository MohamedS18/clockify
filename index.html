<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clockify</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__left">
        <div class="header__left--menu">
          <img src="assets/menu-icon.svg" />
        </div>
        <div class="header__left--logo">
          <img src="https://app.clockify.me/assets/clockify-logo.svg" />
        </div>
        <div class="header__dashed--border"></div>
        <div>Org's name</div>
        <div>
          <img
            src="https://app.clockify.me//assets/ui-icons/menu-dots-vertical.svg"
          />
        </div>
        <button class="header__left--button">UPGRADE</button>
      </div>
      <div class="header__right">
        <div class="header__dashed--border"></div>
        <div class="header__right--item">
          <img
            src="https://app.clockify.me/assets/integrations/addon-grey-border.svg"
          />
        </div>
        <div class="header__dashed--border"></div>

        <div class="header__right--item">
          <img
            src="https://app.clockify.me/assets/nav-icons/notification.svg"
          />
        </div>
        <div class="header__dashed--border"></div>

        <div class="header__right--item">
          <img src="https://app.clockify.me/assets/nav-icons/help.svg" />
        </div>
        <div class="header__dashed--border"></div>

        <div class="header__right--item">
          <div class="header__right--profile">MS</div>
        </div>
      </div>
    </header>
    <nav class="navbar">
      <div class="navbar__container">
        <section class="navbar__section">
          <div class="navbar__section--item">
            <div class="navbar__item--image">
              <img
                src="https://app.clockify.me/assets/nav-icons/time-tracker.svg"
              />
            </div>
            <div class="navbar__item--title">TIME TRACKER</div>
          </div>
          <div class="navbar__section--item">
            <div class="navbar__item--image">
              <img
                src="https://app.clockify.me/assets/nav-icons/calendar.svg"
              />
            </div>
            <div class="navbar__item--title">CALENDER</div>
          </div>
        </section>
        <section class="navbar__section">
          <div class="navbar__section--title">ANALYSE</div>
          <div class="navbar__section--item">
            <div class="navbar__item--image">
              <img
                src="https://app.clockify.me/assets/nav-icons/dashboard.svg"
              />
            </div>
            <div class="navbar__item--title">DASHBOARD</div>
          </div>
          <div class="navbar__section--item">
            <div class="navbar__item--image">
              <img src="https://app.clockify.me/assets/nav-icons/reports.svg" />
            </div>
            <div class="navbar__item--title">REPORTS</div>
          </div>
        </section>
        <section class="navbar__section">
          <div class="navbar__section--title">MANAGE</div>
          <div class="navbar__section--item">
            <div class="navbar__item--image">
              <img
                src="https://app.clockify.me/assets/nav-icons/projects.svg"
              />
            </div>
            <div class="navbar__item--title">PROJECTS</div>
          </div>
          <div class="navbar__section--item">
            <div class="navbar__item--image">
              <img src="https://app.clockify.me/assets/nav-icons/teams.svg" />
            </div>
            <div class="navbar__item--title">TEAM</div>
          </div>
          <div class="navbar__section--item">
            <div class="navbar__item--image">
              <img src="https://app.clockify.me/assets/nav-icons/clients.svg" />
            </div>
            <div class="navbar__item--title">CLIENTS</div>
          </div>
          <div class="navbar__section--item">
            <div class="navbar__item--image">
              <img src="https://app.clockify.me/assets/nav-icons/tags.svg" />
            </div>
            <div class="navbar__item--title">TAGS</div>
          </div>
          <div class="navbar__section--item navbar__showmore">
            <div class="navbar__item--image showmoreimage">
              <img
                src="https://app.clockify.me/assets/ui-icons/chevron-down.svg"
              />
            </div>
            <div class="navbar__item--showmore">SHOW MORE</div>
          </div>
        </section>
        <section class="navbar__section--showmore"></section>
      </div>
      <div class="navbar__minimise"></div>
    </nav>
    <main class="main">
      <div class="main__input">
        <input
          class="main__input--task main--input"
          type="text"
          placeholder="What are you working on"
        />
        <div class="main__input--right">
          <div class="main__dashed--border"></div>
          <div class="main__input--icon">
            <img src="https://app.clockify.me/assets/ui-icons/tag-gray.svg" />
          </div>
          <div class="main__dashed--border"></div>
          <div class="main__input--icon">$</div>
          <div class="main__dashed--border"></div>
          <div class="main__input--datecontainer">
            <input class="main__input--time" type="text" />
            <div>-</div>
            <input class="main__input--time" type="text" />
            <input class="main__input--date" type="date" />
            <div class="main__date--show">Today</div>
          </div>
          <div class="main__input--stopwatch">00:00:00</div>
          <button class="main__input--startbutton">START</button>
          <div class="main__input--manual">
            <button class="main__input--timerbutton">
              <img
                src="https://app.clockify.me/assets/ui-icons/clock-blue.svg"
              />
            </button>
            <button class="main__input--manualbutton">
              <img
                src="https://app.clockify.me/assets/ui-icons/list-gray.svg"
              />
            </button>
          </div>
        </div>
      </div>
      <div class="main__tasks"></div>
    </main>
    <script type="module" src="scripts/data.js"></script>
    <script type="module" src="scripts/script.js"></script>
    <script type="module" src="scripts/interface.js"></script>
    <script type="module" src="scripts/timer.js"></script>
  </body>
</html>

<div class="main__day" data-date="${date}">
  <div class="main__day--title">
    <div>${formatDayTitle(date)}</div>
    <div class="main__day--right">
      Total: <span class="main__day--totaltime">${secondsToHMS(dayTotal)}</span
      ><img src="https://app.clockify.me/assets/ui-icons/bulk-edit.svg" />
    </div>
  </div>
  ${tasksHTML}
  <div class="main__day--bottom"></div>
</div>
